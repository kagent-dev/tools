{{- with .Values.podDisruptionBudget }}
{{- if .enabled }}
{{- $hasMinAvailable := and (hasKey . "minAvailable") (ne .minAvailable nil) }}
{{- $hasMaxUnavailable := and (hasKey . "maxUnavailable") (ne .maxUnavailable nil) }}
{{- if and $hasMinAvailable $hasMaxUnavailable }}
{{- fail "podDisruptionBudget: set only one of minAvailable or maxUnavailable" }}
{{- end }}
{{- if not (or $hasMinAvailable $hasMaxUnavailable) }}
{{- fail "podDisruptionBudget: one of minAvailable or maxUnavailable is required when enabled" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kagent-tools.fullname" $ }}
  namespace: {{ include "kagent-tools.namespace" $ }}
  labels:
    {{- include "kagent-tools.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $hasMinAvailable }}
  minAvailable: {{ .minAvailable }}
  {{- end }}
  {{- if $hasMaxUnavailable }}
  maxUnavailable: {{ .maxUnavailable }}
  {{- end }}
  {{- with .unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kagent-tools.selectorLabels" $ | nindent 6 }}
{{- end }}
{{- end }}
