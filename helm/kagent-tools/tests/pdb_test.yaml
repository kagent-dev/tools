suite: test pod disruption budget
templates:
  - pdb.yaml
tests:
  - it: should not render pdb by default
    template: pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render pdb when enabled with minAvailable
    template: pdb.yaml
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: RELEASE-NAME
      - equal:
          path: spec.minAvailable
          value: 1
      - isNull:
          path: spec.maxUnavailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: RELEASE-NAME
            app.kubernetes.io/instance: RELEASE-NAME

  - it: should render pdb with maxUnavailable and annotations/labels
    template: pdb.yaml
    set:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: "50%"
        unhealthyPodEvictionPolicy: IfHealthyBudget
        labels:
          custom-label: pdb-label
        annotations:
          custom-annotation: pdb-annotation
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: "50%"
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: IfHealthyBudget
      - equal:
          path: metadata.labels["custom-label"]
          value: pdb-label
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: pdb-annotation

  - it: should render minAvailable of zero
    template: pdb.yaml
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: 0
    asserts:
      - equal:
          path: spec.minAvailable
          value: 0
      - notExists:
          path: spec.maxUnavailable

  - it: should render maxUnavailable of zero
    template: pdb.yaml
    set:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 0
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0
      - notExists:
          path: spec.minAvailable

  - it: should fail when both minAvailable and maxUnavailable are set
    template: pdb.yaml
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
        maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "podDisruptionBudget: set only one of minAvailable or maxUnavailable"

  - it: should fail when neither minAvailable nor maxUnavailable is set
    template: pdb.yaml
    set:
      podDisruptionBudget:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "podDisruptionBudget: one of minAvailable or maxUnavailable is required when enabled"
