service:
  type: NodePort
  ports:
    tools:
      nodePort: 30885

tools:
  image:
    registry: cr.kagent.dev
  metrics:
    # Must differ from service.ports.tools.targetPort (8084): the deployment
    # template declares both the tools port and the metrics port, and Helm 4
    # rejects the resulting duplicate containerPort entries.
    port: "8085"

otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: http://host.docker.internal:4317
        timeout: 15
        insecure: true